    .paper-card {

        display: flex;
        flex-direction: column;
    }

    /* Fixed Aspect Ratio Preview Area */
    .preview-box {
        width: 100%;
        height: 180px; 
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f8fafc;
    }

    .preview-box img {
        width: 100%;
        height: 100%;
        object-fit: cover; 
    }

    /* Split Action Container placed directly below images */
    .grid-button-group {
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 15px 10px;
        border-top: 1px solid #000000;
        background-color: #ffffff;
    }

    /* Core link text styles matching the DOI LINK | POWERPOINT format */

        color: #000000 !important; /* Forces link text to remain black matching layout style */
        text-decoration: none !important; /* Clear out global line decorations */
    }
    .grid-link:hover {
        text-decoration: underline !important;
        color: #2563eb !important;
    }

    /* Handles neat breakdown scaling when viewed on mobile phones */

        .resources-grid {
            grid-template-columns: 1fr;
            border-right: 2px solid #000000;
        }
        .paper-card {
            border-right: none;

    }
