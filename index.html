        /* Modern & Clean Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #1e293b;
            line-height: 1.7;
            padding: 40px 20px;
        }

        /* Container Card */
        .container {
            max-width: 750px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 40px;
        }

        /* Header Section */
        .profile-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .profile-header h1 {
            font-size: 2.5rem;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .profile-header p {
            font-size: 1.1rem;
            color: #2563eb;
            font-weight: 500;
        }

        /* Section Layout */
        section {
            margin-bottom: 35px;
        }

        h2 {
            font-size: 1.4rem;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 6px;
            margin-bottom: 16px;
            font-weight: 600;
        }

        /* Item Lists Styling */
        .item {
            margin-bottom: 16px;
        }

        .item-title {
            font-weight: 600;
            color: #1e293b;
        }

        .item-meta {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 4px;
        }

        .item-desc {
            color: #475569;
            font-size: 0.95rem;
        }

        /* Links & Buttons */
        .contact-links {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            margin: 0 5px;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #2563eb;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #334155;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }
    </style>
</head>
