  <style>
    /* 1. Global Reset & Base Setup */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    html {
        overflow-y: scroll;
    }

    body {
        background-color: #f8fafc;
        color: #000000;
        line-height: 1.7;
        padding: 40px 20px;
    }

    /* 2. Primary Layout Containers */
    .container {
        max-width: 1100px; /* Expanded max-width to fit 3 items per row beautifully */
        margin: 0 auto;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        padding: 40px;
    }

    section {
        margin-bottom: 35px;
    }

    /* 3. Typography & Headers */
    .profile-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .profile-header h1 {
        font-size: 2.0rem;
        color: #000000;
        margin-bottom: 8px;
    }

    .profile-header p {
        font-size: 1.3rem;
        color: #000000;
        font-weight: 500;
    }

    h2 {
        font-size: 1.5rem;
        color: #000000;
        font-weight: bold;
        border-bottom: 2px solid #000000;
        padding-bottom: 6px;
        margin-bottom: 16px;
    }

    /* 4. Text Item Lists Styling */
    .item {
        margin-bottom: 20px; 
    }

    .item-title, .item-meta, .item-desc {
        font-size: 1rem; 
        color: #000000;
    }

    .item-title {
        font-weight: bold; /* Added missing semicolon here */
    }

    .item-meta {
        margin-bottom: 4px;
    }

    .item-desc {
        margin-bottom: 8px;
    }

    /* 5. Standard Global Links & Buttons */
    a {
        color: #2563eb;
        text-decoration: underline;
    }

    a:hover {
        color: #1d4ed8;
    }

    .contact-links {
        text-align: center;
        margin-top: 40px;
        padding-top: 20px;
        border-top: 1px solid #e2e8f0;
    }

    .contact-links .btn {
        text-decoration: none; 
    }

    .btn {
        display: inline-block;
        padding: 8px 18px;
        border-radius: 6px;
        font-size: 0.9rem;
        font-weight: 500;
        margin: 0 5px;
        transition: all 0.2s ease;
    }

    .btn-primary {
        background: #2563eb;
        color: #ffffff;
    }

    .btn-primary:hover {
        background: #1d4ed8;
    }

    .btn-secondary {
        background: #f1f5f9;
        color: #000000;
    }

    .btn-secondary:hover {
        background: #e2e8f0;
    }

    /* 6. Strict Grid-Table Layout (3 Columns Across) */
    .resources-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border-top: 2px solid #000000;
        border-left: 2px solid #000000;
        margin: 30px auto;
    }

    /* Grid Box Item mimicking structural grid lines */
    .paper-card {
        border-right: 2px solid #000000;
        border-bottom: 2px solid #000000;
        background: #ffffff;
        display: flex;
        flex-direction: column;
    }

    /* Fixed Aspect Ratio Preview Area */
    .preview-box {
        width: 100%;
        height: 180px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f1f5f9;
        font-size: 1.05rem;  
        color: #000000;   
        font-weight: 600;   
        text-align: center; 
        padding: 20px;      
    }

    .preview-box img {
        width: 100%;
        height: 100%;
        object-fit: cover; 
    }

    /* Split Action Container placed directly below images */
    .grid-button-group {
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 15px 10px;
        border-top: 1px solid #000000;
        background-color: #ffffff;
    }

    /* Core link text styles matching DOI LINK | POWERPOINT format */
    .grid-link {
        font-size: 0.85rem;
        font-weight: bold;
        text-transform: uppercase;
        color: #000000 !important; /* Forces link text to remain black matching layout style */
        text-decoration: none !important; /* Clear out global line decorations */
    }

    .grid-link:hover {
        text-decoration: underline !important;
        color: #2563eb !important;
    }

    /* 7. Responsive Media Queries for Mobile Screens */
    @media (max-width: 800px) {
        .resources-grid {
        grid-template-columns: 1fr;
        border-right: 2px solid #000000;
        }
        .paper-card {
        border-right: none;
        }
    }
  </style>
